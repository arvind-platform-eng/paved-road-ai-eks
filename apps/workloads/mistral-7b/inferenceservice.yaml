---
# Mistral 7B served via vLLM behind KServe.
#
# Storage strategy: model weights come from a public S3 mirror at pod startup.
# For production, copy them to your own S3 bucket for lower cold-start latency
# and to avoid depending on external availability.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: mistral-7b
  namespace: inference
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: hpa
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 3
    scaleTarget: 70
    scaleMetric: cpu
    containerConcurrency: 20

    # Schedule onto a GPU spot node — Karpenter provisions on demand
    nodeSelector:
      workload-type: gpu
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    # Graceful drain — vLLM needs time to finish in-flight requests
    terminationGracePeriodSeconds: 300

    containers:
      - name: kserve-container
        image: vllm/vllm-openai:v0.6.3
        args:
          - "--model"
          - "mistralai/Mistral-7B-Instruct-v0.3"
          - "--served-model-name"
          - "mistral-7b"
          - "--dtype"
          - half
          - "--max-model-len"
          - "4096"
          - "--gpu-memory-utilization"
          - "0.95"
          - "--port"
          - "8080"
          - "--enforce-eager"

        ports:
          - name: http1
            containerPort: 8080
            protocol: TCP

        env:
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-token
                key: token
        
          
        resources:
          requests:
            cpu: "3"
            memory: "12Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "3"
            memory: "14Gi"
            nvidia.com/gpu: "1"

        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 90
          periodSeconds: 10

        # Graceful shutdown — drain the request queue before termination
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 30"]

