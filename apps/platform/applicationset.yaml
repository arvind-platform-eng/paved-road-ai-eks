---
# Platform ApplicationSet — deploys the shared platform components:
# KServe, cert-manager, ingress-nginx.
# Karpenter and monitoring are Terraform-managed (they need IAM setup).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            repoURL: https://charts.jetstack.io
            chart: cert-manager
            version: v1.16.1
            values: |
              installCRDs: true

          - name: ingress-nginx
            namespace: ingress-nginx
            repoURL: https://kubernetes.github.io/ingress-nginx
            chart: ingress-nginx
            version: 4.11.3
            values: |
              controller:
                service:
                  annotations:
                    service.beta.kubernetes.io/aws-load-balancer-type: nlb

          - name: knative-serving
            namespace: knative-serving
            repoURL: https://knative.github.io/operator
            chart: knative-operator
            version: 1.15.6
            values: |
              knativeServing:
                enabled: true

          - name: kserve
            namespace: kserve
            repoURL: oci://ghcr.io/kserve/charts
            chart: kserve
            version: v0.13.1
            values: |
              kserve:
                controller:
                  gateway:
                    ingressGateway:
                      className: nginx

  template:
    metadata:
      name: '{{name}}'
    spec:
      project: default
      source:
        chart: '{{chart}}'
        repoURL: '{{repoURL}}'
        targetRevision: '{{version}}'
        helm:
          releaseName: '{{name}}'
          values: |
            {{values}}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
