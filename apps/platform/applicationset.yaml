apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            chart: cert-manager
            repoURL: https://charts.jetstack.io
            version: v1.16.1
            helm:
              values: |
                installCRDs: true

          - name: ingress-nginx
            namespace: ingress-nginx
            chart: ingress-nginx
            repoURL: https://kubernetes.github.io/ingress-nginx
            version: 4.11.3
            helm:
              values: |
                controller:
                  service:
                    annotations:
                      service.beta.kubernetes.io/aws-load-balancer-type: nlb

          - name: knative-serving
            namespace: knative-serving
            chart: knative-operator
            repoURL: https://knative.github.io/operator
            version: 1.15.6
            helm:
              values: |
                knativeServing:
                  enabled: true

          - name: kserve
            namespace: kserve
            chart: kserve
            repoURL: oci://ghcr.io/kserve/charts
            version: v0.13.1
            helm:
              values: |
                kserve:
                  controller:
                    gateway:
                      ingressGateway:
                        className: nginx

  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      source:
        chart: '{{ .chart }}'
        repoURL: '{{ .repoURL }}'
        targetRevision: '{{ .version }}'
        helm:
          releaseName: '{{ .name }}'
          values: '{{ .helm.values }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
