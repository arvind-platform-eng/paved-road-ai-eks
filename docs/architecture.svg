<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <style>
    .layer-bg { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1; }
    .box { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.5; rx: 6; }
    .box-primary { fill: #E6F1FB; stroke: #378ADD; stroke-width: 1.5; rx: 6; }
    .box-warn { fill: #FAEEDA; stroke: #EF9F27; stroke-width: 1.5; rx: 6; }
    .box-success { fill: #E1F5EE; stroke: #1D9E75; stroke-width: 1.5; rx: 6; }
    .layer-label { font-size: 12px; font-weight: 600; fill: #475569; }
    .box-title { font-size: 13px; font-weight: 600; fill: #0F172A; }
    .box-sub { font-size: 11px; fill: #475569; }
    .arrow { fill: none; stroke: #64748B; stroke-width: 1.5; marker-end: url(#arrowhead); }
    .arrow-strong { fill: none; stroke: #185FA5; stroke-width: 2; marker-end: url(#arrowhead-blue); }
    .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
    .subtitle { font-size: 12px; fill: #64748B; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748B" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#185FA5" />
    </marker>
  </defs>

  <text x="30" y="30" class="title">Paved Road for AI Workloads on EKS</text>
  <text x="30" y="50" class="subtitle">Reference architecture — vLLM inference on EKS with GitOps, GPU autoscaling, and observability</text>

  <!-- LAYER 1: Developer / Client -->
  <rect x="30" y="80" width="840" height="70" class="layer-bg" rx="8" />
  <text x="45" y="100" class="layer-label">CLIENT LAYER</text>
  <rect x="60" y="105" width="140" height="35" class="box" />
  <text x="130" y="122" text-anchor="middle" class="box-title">Client apps</text>
  <text x="130" y="135" text-anchor="middle" class="box-sub">HTTP / OpenAI API</text>

  <rect x="230" y="105" width="140" height="35" class="box" />
  <text x="300" y="122" text-anchor="middle" class="box-title">Developer</text>
  <text x="300" y="135" text-anchor="middle" class="box-sub">git push</text>

  <!-- LAYER 2: GitOps -->
  <rect x="30" y="170" width="840" height="80" class="layer-bg" rx="8" />
  <text x="45" y="190" class="layer-label">GITOPS CONTROL PLANE</text>

  <rect x="60" y="200" width="140" height="40" class="box-primary" />
  <text x="130" y="217" text-anchor="middle" class="box-title">GitHub repo</text>
  <text x="130" y="231" text-anchor="middle" class="box-sub">Terraform + K8s YAML</text>

  <rect x="240" y="200" width="140" height="40" class="box-primary" />
  <text x="310" y="217" text-anchor="middle" class="box-title">GitHub Actions</text>
  <text x="310" y="231" text-anchor="middle" class="box-sub">CI: validate, lint</text>

  <rect x="420" y="200" width="140" height="40" class="box-primary" />
  <text x="490" y="217" text-anchor="middle" class="box-title">ArgoCD</text>
  <text x="490" y="231" text-anchor="middle" class="box-sub">GitOps reconciler</text>

  <rect x="600" y="200" width="140" height="40" class="box-primary" />
  <text x="670" y="217" text-anchor="middle" class="box-title">ApplicationSet</text>
  <text x="670" y="231" text-anchor="middle" class="box-sub">Platform + workloads</text>

  <!-- LAYER 3: EKS Cluster -->
  <rect x="30" y="270" width="840" height="180" class="layer-bg" rx="8" />
  <text x="45" y="290" class="layer-label">EKS CLUSTER (AWS · Multi-AZ)</text>

  <!-- System nodes -->
  <rect x="60" y="300" width="180" height="60" class="box" />
  <text x="150" y="320" text-anchor="middle" class="box-title">System node group</text>
  <text x="150" y="335" text-anchor="middle" class="box-sub">2× t3.medium</text>
  <text x="150" y="349" text-anchor="middle" class="box-sub">CoreDNS · Karpenter</text>

  <!-- Karpenter -->
  <rect x="270" y="300" width="180" height="60" class="box-warn" />
  <text x="360" y="320" text-anchor="middle" class="box-title">Karpenter</text>
  <text x="360" y="335" text-anchor="middle" class="box-sub">Spot-first GPU pool</text>
  <text x="360" y="349" text-anchor="middle" class="box-sub">g5 · g4dn families</text>

  <!-- KServe -->
  <rect x="480" y="300" width="180" height="60" class="box-primary" />
  <text x="570" y="320" text-anchor="middle" class="box-title">KServe</text>
  <text x="570" y="335" text-anchor="middle" class="box-sub">InferenceService CRD</text>
  <text x="570" y="349" text-anchor="middle" class="box-sub">Canary + versioning</text>

  <!-- GPU nodes with vLLM -->
  <rect x="270" y="375" width="390" height="60" class="box-success" />
  <text x="465" y="395" text-anchor="middle" class="box-title">GPU node (Karpenter-provisioned, spot)</text>
  <text x="465" y="410" text-anchor="middle" class="box-sub">g5.xlarge · vLLM pod serving Mistral 7B</text>
  <text x="465" y="424" text-anchor="middle" class="box-sub">PagedAttention · bfloat16 · queue-depth autoscaling</text>

  <!-- Model storage -->
  <rect x="680" y="375" width="160" height="60" class="box" />
  <text x="760" y="395" text-anchor="middle" class="box-title">S3 model store</text>
  <text x="760" y="410" text-anchor="middle" class="box-sub">Storage-initializer</text>
  <text x="760" y="424" text-anchor="middle" class="box-sub">pulls at startup</text>

  <!-- LAYER 4: Observability -->
  <rect x="30" y="470" width="840" height="100" class="layer-bg" rx="8" />
  <text x="45" y="490" class="layer-label">OBSERVABILITY</text>

  <rect x="60" y="500" width="180" height="50" class="box" />
  <text x="150" y="519" text-anchor="middle" class="box-title">Prometheus</text>
  <text x="150" y="536" text-anchor="middle" class="box-sub">vLLM + DCGM + kube metrics</text>

  <rect x="270" y="500" width="180" height="50" class="box" />
  <text x="360" y="519" text-anchor="middle" class="box-title">Grafana</text>
  <text x="360" y="536" text-anchor="middle" class="box-sub">GPU · token/sec · p99 latency</text>

  <rect x="480" y="500" width="180" height="50" class="box" />
  <text x="570" y="519" text-anchor="middle" class="box-title">AlertManager</text>
  <text x="570" y="536" text-anchor="middle" class="box-sub">SLO burn · GPU saturation</text>

  <rect x="690" y="500" width="150" height="50" class="box" />
  <text x="765" y="519" text-anchor="middle" class="box-title">DCGM exporter</text>
  <text x="765" y="536" text-anchor="middle" class="box-sub">GPU utilization</text>

  <!-- ARROWS -->
  <!-- Client to KServe -->
  <path class="arrow" d="M 130 140 L 130 200" />
  <path class="arrow" d="M 300 140 L 300 200" />

  <!-- GitOps flow -->
  <path class="arrow" d="M 200 220 L 240 220" />
  <path class="arrow" d="M 380 220 L 420 220" />
  <path class="arrow" d="M 560 220 L 600 220" />

  <!-- ArgoCD deploys to cluster -->
  <path class="arrow-strong" d="M 670 240 L 670 300 L 570 300" />

  <!-- KServe → GPU pod -->
  <path class="arrow" d="M 570 360 L 570 375" />

  <!-- Model store → vLLM -->
  <path class="arrow" d="M 690 405 L 660 405" />

  <!-- vLLM → Prometheus -->
  <path class="arrow" d="M 300 435 L 150 500" />

  <!-- DCGM → Prometheus -->
  <path class="arrow" d="M 730 550 L 240 525" />
</svg>
